        <h1>Bio Galaxy: Interactive 3D Science Atlas</h1>
        <p>Bio Galaxy connects scientific scales from the cosmos and Tree of Life to anatomy, cells, proteins, molecules, and atoms, rendering source-cited 3D objects and contextual data.</p>
        <p>Its source-aware views use public scientific records from UniProt, Reactome, RCSB Protein Data Bank, Ensembl, Human Protein Atlas, NCBI, PubChem, and astronomy catalogues.</p>
        <p>JavaScript and WebGL are required to open the interactive atlas.</p>
