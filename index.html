        <h1>Bio Galaxy: Google Earth for the Natural Sciences</h1>
        <p>Search any physical thing, from a galaxy to an atom. Bio Galaxy connects 22 scales from the cosmos and Tree of Life to anatomy, cells, proteins, molecules, and atoms, and renders each as a source-cited 3D object.</p>
        <p>Its source-aware views use public scientific records from UniProt, Reactome, RCSB Protein Data Bank, Ensembl, Human Protein Atlas, and NCBI.</p>
